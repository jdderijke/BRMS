# Mosquitto-configuratie voor BRMS (ARCHITECTURE.md §3.1).
# Wordt door deploy/install.sh geïnstalleerd als /etc/mosquitto/mosquitto.conf;
# het origineel van Debian staat in /etc/mosquitto/mosquitto.conf.orig.

# Alleen luisteren op de Pi zelf: niets open op het netwerk of internet.
# (Later, als Tailscale op de Pi staat, komt hier een tweede listener op de
# Tailscale-interface bij, zodat metingen live te volgen zijn vanaf de pc – §3.1 punt 3.)
listener 1883 127.0.0.1

# Zonder wachtwoord: alleen processen op de Pi zelf kunnen verbinden.
allow_anonymous true

# Geen persistence: de broker schrijft niets naar de flashdrive (P7). Na een herstart
# van de broker is niets bewaard; dat is bedoeld (geen retain, geen oude berichten, §3.3).
persistence false

# Logging naar stderr; onder systemd komt dat in journald (geen eigen logbestand op flash).
log_dest stderr
log_type error
log_type warning
log_type notice
log_type information
