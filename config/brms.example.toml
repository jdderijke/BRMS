# Voorbeeldconfiguratie (ARCHITECTURE.md §5.4.1). Kopieer naar config/brms.toml in de
# projectmap (op de Pi: ~/BRMS/config/brms.toml). Dat bestand staat niet in git (bevat later
# o.a. de Victron-encryptiesleutels). Controleren vóór een herstart:
#   brms check-config        (op de pc: python -m brms check-config)
# Een wijziging wordt doorgevoerd door de betreffende service te herstarten.

[mqtt]
host = "localhost"
port = 1883

[opslag]
# Relatief pad = vanaf de projectmap; op de Pi dus ~/BRMS/data/brms.db.
database = "data/brms.db"

[web]
# Webinterface (ARCHITECTURE.md §5.6): http://brms:8080 via Tailscale of aan boord.
# 0.0.0.0 = luisteren op alle netwerkinterfaces van de Pi.
host = "0.0.0.0"
port = 8080

# Bootpagina (ARCHITECTURE.md §5.6 "Bootpagina"): een tekening van de boot met op elke plek
# de actuele waarde van een sensor. Met dit blok is dat de eerste pagina van het web en
# staan de grafieken op /grafieken; zonder dit blok is er geen bootpagina.
#   tekening    een SVG-bestand dat je zelf tekent (bijv. een dia uit PowerPoint, opgeslagen
#               als SVG), naast dit bestand in de map config/. Zet in de tekening op elke
#               plek waar een waarde moet komen de tekst  sensor.grootheid , met de naam van
#               de sensor uit dit bestand, bijvoorbeeld  kajuit.temperatuur . De waarde komt
#               op de plek van de eerste letter. Pijlen, een titel en dergelijke blijven staan.
#               Staat de slagzij er twee keer in (boven = bakboord, onder = stuurboord), dan
#               staat de waarde alleen aan de kant waar de boot naartoe helt.
# Een gewijzigde tekening is zichtbaar na het verversen van de pagina; herstarten hoeft niet.
# [boot]
# tekening = "boot.svg"

# Eén blok per sensor. Alleen sensoren die hier staan worden verwerkt (ARCHITECTURE.md §5.4.2).
#   id          vaste ID; bij BLE-sensoren het MAC-adres (AA:BB:CC:DD:EE:FF), bij een
#               Shelly een vrij gekozen naam (bijv. shelly-bilge)
#   type        bthome (Xiaomi Monitor 3 met pvvx-firmware, BTHome v2)
#               ruuvi  (RuuviTag en RuuviTag Pro, dataformaat 5)
#               victron-bmv        (accumonitor: BMV-700 met dongle, SmartShunt)
#               victron-mppt       (zonnelader: BlueSolar met dongle, SmartSolar)
#               victron-multiplus  (MultiPlus met VE.Bus Smart dongle: walstroom)
#               shelly-uni         (Shelly Plus Uni via wifi: bilge; zie onderaan)
#   sleutel     alleen bij Victron: de versleutelingssleutel van het apparaat (32 tekens).
#               In VictronConnect: apparaat openen -> tandwiel -> Productinfo ->
#               "Instant readout via Bluetooth" aanzetten -> "Versleutelingsgegevens tonen".
#               Daar staat ook het MAC-adres (voor 'id').
#   naam        naam/locatie voor weergave; hernoemen laat de historie intact
#   grootheden  optioneel: alleen deze grootheden meenemen; zonder lijst gaat alles mee.
#               Welke namen een type levert:  brms grootheden bthome
#               (rssi = signaalsterkte; moet in de lijst staan als je die wilt houden)
#   correctie   optioneel, per doorlopende grootheid:
#                 een getal = offset             temperatuur = -0.3
#                 of factor en/of offset         vocht = { factor = 1.02, offset = -1.5 }
#               gecorrigeerd = gemeten × factor + offset
#   stuurboord  alleen bij een Ruuvi, en alleen als je de slagzij wilt (§5.2.5 punt 10):
#               "x", "-x", "y" of "-y" = de versnelling die positief wordt als de boot
#               over stuurboord helt. Zie het voorbeeld bij de Ruuvi hieronder.

[[sensor]]
id = "A4:C1:38:00:00:01"
type = "bthome"
naam = "kajuit"
correctie = { temperatuur = 0.0, vocht = { factor = 1.0, offset = 0.0 } }

[[sensor]]
id = "A4:C1:38:00:00:02"
type = "bthome"
naam = "vooronder"
grootheden = ["temperatuur", "vocht", "batterijspanning", "rssi"]

[[sensor]]
id = "A4:C1:38:00:00:03"
type = "bthome"
naam = "motorruim"

# RuuviTag met slagzij (ARCHITECTURE.md §5.2.5 punt 10). De sensor ligt plat, met één zijde
# in de lengterichting van de boot. Uit de versnellingen berekent BRMS de slagzij in graden.
#
#   stuurboord  Zo vind je de waarde: zet de sensor eerst zonder 'stuurboord' in dit
#               bestand, leg hem neer zoals hij aan boord komt en kantel hem naar stuurboord
#               (de stuurboordkant omlaag). Kijk in een grafiek welke van versnelling_x en
#               versnelling_y duidelijk verandert. Wordt die positief: "x" of "y". Wordt
#               die negatief: "-x" of "-y".
#   correctie   De kalibratie. Lees met de boot recht de slagzij af en vul het
#               tegengestelde in: staat er 1,8° sb, dan slagzij = -1.8; staat er 1,8° bb,
#               dan slagzij = 1.8. In dit bestand is stuurboord positief en bakboord
#               negatief; op de webpagina en in meldingen staat altijd sb of bb.
#
# Onderste boven monteren (bijvoorbeeld tegen een plafond) mag ook:
#   - De hoek blijft kloppen: versnelling_z wordt negatief, maar alleen de grootte telt.
#   - De kant kan omdraaien. Doe de kanteltest voor 'stuurboord' daarom in de stand waarin
#     de sensor uiteindelijk hangt; was het rechtop "y", dan kan het nu "-y" zijn.
#   - Draai of verplaats je de sensor later, doe dan de kanteltest en de kalibratie opnieuw.
# [[sensor]]
# id = "C1:00:00:00:00:01"
# type = "ruuvi"
# naam = "hoofdkajuit"
# stuurboord = "-y"
# correctie = { slagzij = -1.8 }

# Victron-apparaten (ARCHITECTURE.md §5.2.2). Haal het # weg en vul MAC-adres en sleutel in.
# [[sensor]]
# id = "D3:00:00:00:00:01"
# type = "victron-bmv"
# naam = "accu"
# sleutel = "00000000000000000000000000000000"
#
# [[sensor]]
# id = "D3:00:00:00:00:02"
# type = "victron-mppt"
# naam = "zonnepaneel"
# sleutel = "00000000000000000000000000000000"
#
# [[sensor]]
# id = "D3:00:00:00:00:03"
# type = "victron-multiplus"
# naam = "multiplus"
# sleutel = "00000000000000000000000000000000"

# Shelly Plus Uni voor de bilge (ARCHITECTURE.md §5.2.4). Wordt via wifi gepolld door de
# Shelly-reader; de Shelly mag geen wachtwoord hebben. Haal het # weg en vul het adres in.
#   id         vrij gekozen vaste naam (letters, cijfers, - en _); staat in de database
#   adres      IP-adres of hostnaam van de Shelly; geef hem in de router een vast IP-adres
#   interval   seconden tussen twee polls (standaard 30; bilge 2: een pompbeurt kan kort zijn)
#   bron       welke component van de Shelly welke grootheid levert:
#                "input:0" / "input:1"   digitale ingang (contact): gesloten = 1
#                "voltmeter:100"         spanningsmeting; eerst in de Shelly toevoegen als
#                                        randapparaat (Add-on -> Voltmeter). Het nummer
#                                        staat in de Shelly, meestal 100.
#   drempel    spanning in volt vanaf waar een voltmeter-bron 1 geeft (pomp krijgt spanning)
#   omgekeerd  optioneel: grootheden waarvan 0 en 1 verwisseld worden, bijv. ["bilge"] voor
#              een contact dat opengaat als het water stijgt
#   Levert: bilge, bilgepomp (elk alleen met een 'bron') en rssi (signaalsterkte van de wifi).
#   Er is geen tweede vlotter: de Shelly meet alleen de spanning achter de bestaande vlotter
#   van de bilgepomp (bilgepomp). Komt er later een waterdetector op een digitale ingang,
#   dan wordt het: bron = { bilge = "input:0", bilgepomp = "voltmeter:100" }
# [[sensor]]
# id = "shelly-bilge"
# type = "shelly-uni"
# naam = "bilge"
# adres = "192.168.1.50"
# interval = 2
# bron = { bilgepomp = "voltmeter:100" }
# drempel = 6.0

# =============================================================================
# Camera's (ARCHITECTURE.md §5.7)
# =============================================================================
# Eén blok per camera. De camera-reader haalt elke 'foto_interval' een foto op van het
# snapshot-adres en zet die in de opnamemap. Haal het # weg en vul je eigen gegevens in.
#   id             vaste naam (letters, cijfers, '-' en '_'); wordt de mapnaam van de foto's
#   naam           naam voor weergave (mag weg: dan geldt het id)
#   gebruiker,     het account op de camera. Maak op de camera bij voorkeur een eigen
#   wachtwoord     gebruiker voor BRMS aan met alleen kijkrechten.
#   foto_url       het snapshot-adres van de camera (http:// of https://). Op de plaats van
#                  het account staan {gebruiker} en {wachtwoord}; BRMS vult die in. Zet het
#                  wachtwoord dus niet zelf in het adres.
#   video_url      het adres van de videostroom (rtsp://), in H.264. Hiervan komen de
#                  video's (alleen op verzoek of bij een alarm) en "Live camera" op de
#                  opnamepagina (via go2rtc, §5.7 punt 18). Mag weg: dan maakt de camera
#                  geen video's en is er geen live-beeld.
#   foto_interval  tijd tussen twee foto's; standaard "3m"
#   video_duur     lengte van een video; standaard "60s"
#   richten        alleen bij een camera die kan bewegen (draaien en kantelen): het merk,
#                  nu alleen "foscam". Tijdens "Live camera" staan er dan vier knoppen
#                  (links, omhoog, omlaag, rechts); elke klik beweegt de camera een korte
#                  stap (§5.7 punt 19). Laat het veld weg bij een vaste camera: die krijgt
#                  de knoppen niet. De camera blijft staan waar je hem laat; ook de foto's
#                  elke 'foto_interval' en bij een alarm tonen dan die richting.
#                  Het account moet de camera mogen bewegen: bij een Foscam is dat een
#                  'operator'; een 'visitor' mag alleen kijken.
#   richt_stap     hoe lang de camera per klik beweegt; standaard "0.5s" (0,1 s tot 5 s)
#
# Het voorbeeld is een Foscam HD-camera. Het snapshot-adres van een ander merk staat in de
# handleiding van de camera (zoek op "snapshot URL").
# [[camera]]
# id = "dek"
# naam = "Dek"
# gebruiker = "brms"
# wachtwoord = "..."
# foto_url = "http://192.168.1.20:88/cgi-bin/CGIProxy.fcgi?cmd=snapPicture2&usr={gebruiker}&pwd={wachtwoord}"
# video_url = "rtsp://{gebruiker}:{wachtwoord}@192.168.1.20:88/videoMain"
# foto_interval = "3m"
# video_duur = "60s"
# richten = "foscam"       # weglaten bij een camera die niet kan bewegen
# richt_stap = "0.5s"
#
# Waar de opnames staan en hoe lang ze blijven. Zonder dit blok gelden deze waarden. Laat
# de map binnen data/ staan: alleen daar mogen de services schrijven.
# [opnames]
# map = "data/opnames"
# foto_bewaren = "14d"     # foto's ouder dan dit worden vanzelf verwijderd
# video_ruimte = 20        # GB; is dit vol, dan verdwijnen de oudste video's

# =============================================================================
# Meldingen (ARCHITECTURE.md §5.5.4)
# =============================================================================
# Een melding gaat naar elk kanaal dat hier is ingesteld. Zonder kanaal worden alarmen wel
# vastgelegd, maar gaat er geen melding uit. Haal het # weg en vul je eigen gegevens in.
#
# Systeemfouten (§5.5.5): een fout van een BRMS-service of van de kernel (bijv. schrijven
# naar de database mislukt, een service die crasht, een leesfout van de schijf) geeft ook
# een melding, hooguit één per service per uur. Alles staat in het logboek op de pagina
# Systeem. Staat standaard aan; uitzetten kan hier (dit blok moet vóór [melding.telegram]
# en [melding.email] staan):
# [melding]
# systeemfouten = false
#
# Telegram: maak in de Telegram-app een bot aan via @BotFather (/newbot); je krijgt een
# token. Stuur de bot één bericht en open daarna
#   https://api.telegram.org/bot<token>/getUpdates
# in een browser: het getal bij "chat": {"id": ...} is het chat-ID.
# [melding.telegram]
# token = "123456789:AA..."
# chat = 123456789
#
# E-mail: een mailaccount met SMTP. Gebruik een app-wachtwoord, niet je gewone wachtwoord.
# Poort 587 (standaard) of 465. 'van' mag weg als de gebruikersnaam het mailadres is.
# [melding.email]
# server = "smtp.voorbeeld.nl"
# poort = 587
# gebruiker = "boot@voorbeeld.nl"
# wachtwoord = "app-wachtwoord"
# van = "boot@voorbeeld.nl"
# aan = ["ik@voorbeeld.nl"]

# =============================================================================
# Alarmregels (ARCHITECTURE.md §5.5.2, §5.5.3)
# =============================================================================
# Eén blok per regel. Alleen wat hier staat, wordt bewaakt.
#   id          vaste naam van de regel (letters, cijfers, - en _); staat in de database
#   naam        tekst in de melding (zonder: het id)
#   sensoren    voor welke sensoren de regel geldt (naam of id); elk apart beoordeeld
#   soort       "grens"   de waarde ligt boven of onder een grens
#               "aantal"  een aantal binnen een tijdvenster (bewegingen, pompbeurten)
#               "stil"    de sensor levert geen waarden meer
#   grootheid   welke grootheid (niet bij "stil")
#   boven / onder   bij "grens": de grens. Een toestand "= 1" is boven = 0.5, "= 0" is
#               onder = 0.5.
#   duur        zo lang moet de voorwaarde onafgebroken gelden (zonder: direct)
#   herstel     bij "grens": de herstelgrens; het verschil met de grens is de hysterese
#   herstelduur zo lang moet de herstelvoorwaarde gelden (zonder: direct)
#   aantal, venster   bij "aantal": zoveel of meer binnen dit tijdvenster
#   melding     "uit" (alleen vastleggen), "eenmalig" of "herhaald"
#   herhaling   bij "herhaald": de tussenpoos van de herinnering
#   herstelmelding   false = geen melding bij herstel
#   prioriteit  "urgent", "hoog" (met geluid in Telegram) of "normaal" (zonder geluid)
# Met een camera (zie [[camera]] hierboven):
#   foto        "begin": de melding krijgt een foto mee van het moment dat het alarm
#               afgaat; "elke": ook elke herinnering. Komt de foto niet binnen 15 s, dan
#               gaat de melding zonder foto.
#   actie       wat er gebeurt als het alarm afgaat, los van de melding:
#               actie = [{ type = "video" }]   een video-opname
#               actie = [{ type = "foto" }]    een extra foto tussen de intervalfoto's
#   camera      het id van de camera voor foto en actie (zonder: de eerste camera)
# Tijden: een getal met eenheid: "90s", "15m", "6u", "7d".

[[alarm]]
id = "vorst"
naam = "Vorst"
sensoren = ["kajuit", "vooronder", "motorruim"]
grootheid = "temperatuur"
soort = "grens"
onder = 2.0
duur = "15m"
herstel = 3.0
herhaling = "12u"
prioriteit = "hoog"

[[alarm]]
id = "vocht"
naam = "Vocht"
sensoren = ["kajuit", "motorruim"]
grootheid = "vocht"
soort = "grens"
boven = 80.0
duur = "6u"
herstel = 75.0
herhaling = "24u"

[[alarm]]
id = "sensor-stil"
naam = "Sensor stil"
sensoren = ["kajuit", "vooronder", "motorruim"]
soort = "stil"
duur = "30m"
herhaling = "24u"

[[alarm]]
id = "sensorbatterij"
naam = "Sensorbatterij laag"
sensoren = ["kajuit", "vooronder", "motorruim"]
grootheid = "batterijspanning"
soort = "grens"
onder = 2.5
duur = "1u"
herstel = 2.6
herhaling = "7d"

# De overige regels van §5.5.2 horen bij sensoren die hierboven uitgecommentarieerd staan
# (Victron, Shelly, Ruuvi). Haal het # weg zodra die sensoren in de configuratie staan.
#
# Het alarm "bilge" hieronder is alleen nodig als er een waterdetector op de Shelly zit
# (grootheid bilge, §5.2.4); zonder detector blijft het uitgecommentarieerd.
# [[alarm]]
# id = "bilge"
# naam = "Bilge"
# sensoren = ["bilge"]
# grootheid = "bilge"
# soort = "grens"
# boven = 0.5
# herstelduur = "5m"
# herhaling = "1u"
# prioriteit = "urgent"
#
# [[alarm]]
# id = "bilgepomp-lang"
# naam = "Bilgepomp lang"
# sensoren = ["bilge"]
# grootheid = "bilgepomp"
# soort = "grens"
# boven = 0.5
# duur = "3m"
# herhaling = "1u"
# prioriteit = "urgent"
#
# [[alarm]]
# id = "bilgepomp-vaak"
# naam = "Bilgepomp vaak"
# sensoren = ["bilge"]
# grootheid = "bilgepomp"
# soort = "aantal"
# aantal = 4
# venster = "6u"
# herhaling = "12u"
# prioriteit = "hoog"
#
# [[alarm]]
# id = "walstroom"
# naam = "Walstroom weg"
# sensoren = ["multiplus"]
# grootheid = "walstroom"
# soort = "grens"
# onder = 0.5
# duur = "2m"
# herstelduur = "2m"
# herhaling = "12u"
# prioriteit = "urgent"
#
# [[alarm]]
# id = "accu-laag"
# naam = "Accu laag"
# sensoren = ["accu"]
# grootheid = "soc"
# soort = "grens"
# onder = 50.0
# duur = "10m"
# herstel = 55.0
# herhaling = "12u"
# prioriteit = "hoog"
#
# Beweging (§5.5.1): alleen bij een Ruuvi. De 10 minuten rust voorkomt een reeks alarmen
# bij storm.
# [[alarm]]
# id = "beweging"
# naam = "Beweging"
# sensoren = ["motorruim"]
# grootheid = "beweging"
# soort = "aantal"
# aantal = 5
# venster = "60s"
# herstelduur = "10m"
# herstelmelding = false
# foto = "begin"
# actie = [{ type = "video" }]
#
# Slagzij (§5.2.5 punt 10): alleen bij een Ruuvi met het veld 'stuurboord'. Twee regels,
# één per kant: stuurboord is positief ('boven'), bakboord negatief ('onder', met een min).
# De grenzen zijn een voorbeeld; kies ze zelf.
# [[alarm]]
# id = "slagzij-sb"
# naam = "Slagzij stuurboord"
# sensoren = ["hoofdkajuit"]
# grootheid = "slagzij"
# soort = "grens"
# boven = 5.0
# duur = "15m"
# herstel = 4.0
#
# [[alarm]]
# id = "slagzij-bb"
# naam = "Slagzij bakboord"
# sensoren = ["hoofdkajuit"]
# grootheid = "slagzij"
# soort = "grens"
# onder = -5.0
# duur = "15m"
# herstel = -4.0
#
# Camera stil (§5.5.3 punt 2): een camera is geen sensor, maar mag wel in een regel van
# soort "stil" staan. Elke geslaagde opname telt als levensteken: valt de camera uit (of
# de camera-service), dan komen er geen intervalfoto's meer en gaat dit alarm af. De duur
# moet langer zijn dan het foto-interval van de camera.
# [[alarm]]
# id = "camera-stil"
# naam = "Camera stil"
# sensoren = ["dek"]
# soort = "stil"
# duur = "15m"
# herhaling = "24u"
