# Voorbeeldconfiguratie (ARCHITECTURE.md §5.4.1). Kopieer naar config/brms.toml in de
# projectmap (op de Pi: ~/BRMS/config/brms.toml). Dat bestand staat niet in git (bevat later
# o.a. de Victron-encryptiesleutels). Controleren vóór een herstart:
#   brms check-config        (op de pc: python -m brms check-config)
# Een wijziging wordt doorgevoerd door de betreffende service te herstarten.

[mqtt]
host = "localhost"
port = 1883

[opslag]
# Relatief pad = vanaf de projectmap; op de Pi dus ~/BRMS/data/brms.db.
database = "data/brms.db"

[web]
# Webinterface (ARCHITECTURE.md §5.6): http://brms:8080 via Tailscale of aan boord.
# 0.0.0.0 = luisteren op alle netwerkinterfaces van de Pi.
host = "0.0.0.0"
port = 8080

# Eén blok per sensor. Alleen sensoren die hier staan worden verwerkt (ARCHITECTURE.md §5.4.2).
#   id          vaste ID; bij BLE-sensoren het MAC-adres (AA:BB:CC:DD:EE:FF), bij een
#               Shelly een vrij gekozen naam (bijv. shelly-bilge)
#   type        bthome (Xiaomi Monitor 3 met pvvx-firmware, BTHome v2)
#               ruuvi  (RuuviTag en RuuviTag Pro, dataformaat 5)
#               victron-bmv        (accumonitor: BMV-700 met dongle, SmartShunt)
#               victron-mppt       (zonnelader: BlueSolar met dongle, SmartSolar)
#               victron-multiplus  (MultiPlus met VE.Bus Smart dongle: walstroom)
#               shelly-uni         (Shelly Plus Uni via wifi: bilge; zie onderaan)
#   sleutel     alleen bij Victron: de versleutelingssleutel van het apparaat (32 tekens).
#               In VictronConnect: apparaat openen -> tandwiel -> Productinfo ->
#               "Instant readout via Bluetooth" aanzetten -> "Versleutelingsgegevens tonen".
#               Daar staat ook het MAC-adres (voor 'id').
#   naam        naam/locatie voor weergave; hernoemen laat de historie intact
#   grootheden  optioneel: alleen deze grootheden meenemen; zonder lijst gaat alles mee.
#               Welke namen een type levert:  brms grootheden bthome
#               (rssi = signaalsterkte; moet in de lijst staan als je die wilt houden)
#   correctie   optioneel, per doorlopende grootheid:
#                 een getal = offset             temperatuur = -0.3
#                 of factor en/of offset         vocht = { factor = 1.02, offset = -1.5 }
#               gecorrigeerd = gemeten × factor + offset

[[sensor]]
id = "A4:C1:38:00:00:01"
type = "bthome"
naam = "kajuit"
correctie = { temperatuur = 0.0, vocht = { factor = 1.0, offset = 0.0 } }

[[sensor]]
id = "A4:C1:38:00:00:02"
type = "bthome"
naam = "vooronder"
grootheden = ["temperatuur", "vocht", "batterijspanning", "rssi"]

[[sensor]]
id = "A4:C1:38:00:00:03"
type = "bthome"
naam = "motorruim"

# Victron-apparaten (ARCHITECTURE.md §5.2.2). Haal het # weg en vul MAC-adres en sleutel in.
# [[sensor]]
# id = "D3:00:00:00:00:01"
# type = "victron-bmv"
# naam = "accu"
# sleutel = "00000000000000000000000000000000"
#
# [[sensor]]
# id = "D3:00:00:00:00:02"
# type = "victron-mppt"
# naam = "zonnepaneel"
# sleutel = "00000000000000000000000000000000"
#
# [[sensor]]
# id = "D3:00:00:00:00:03"
# type = "victron-multiplus"
# naam = "multiplus"
# sleutel = "00000000000000000000000000000000"

# Shelly Plus Uni voor de bilge (ARCHITECTURE.md §5.2.4). Wordt via wifi gepolld door de
# Shelly-reader; de Shelly mag geen wachtwoord hebben. Haal het # weg en vul het adres in.
#   id         vrij gekozen vaste naam (letters, cijfers, - en _); staat in de database
#   adres      IP-adres of hostnaam van de Shelly; geef hem in de router een vast IP-adres
#   interval   seconden tussen twee polls (standaard 30; bilge 2: een pompbeurt kan kort zijn)
#   bron       welke component van de Shelly welke grootheid levert:
#                "input:0" / "input:1"   digitale ingang (contact): gesloten = 1
#                "voltmeter:100"         spanningsmeting; eerst in de Shelly toevoegen als
#                                        randapparaat (Add-on -> Voltmeter). Het nummer
#                                        staat in de Shelly, meestal 100.
#   drempel    spanning in volt vanaf waar een voltmeter-bron 1 geeft (pomp krijgt spanning)
#   omgekeerd  optioneel: grootheden waarvan 0 en 1 verwisseld worden, bijv. ["bilge"] voor
#              een vlotter waarvan het contact opengaat als het water stijgt
#   Levert: bilge, bilgepomp (elk alleen met een 'bron') en rssi (signaalsterkte van de wifi).
# [[sensor]]
# id = "shelly-bilge"
# type = "shelly-uni"
# naam = "bilge"
# adres = "192.168.1.50"
# interval = 2
# bron = { bilge = "input:0", bilgepomp = "voltmeter:100" }
# drempel = 6.0
