# Voorbeeldconfiguratie (ARCHITECTURE.md §5.4.1). Kopieer naar config/brms.toml in de
# projectmap (op de Pi: ~/BRMS/config/brms.toml). Dat bestand staat niet in git (bevat later
# o.a. de Victron-encryptiesleutels). Controleren vóór een herstart:
#   brms check-config        (op de pc: python -m brms check-config)
# Een wijziging wordt doorgevoerd door de betreffende service te herstarten.

[mqtt]
host = "localhost"
port = 1883

[opslag]
# Relatief pad = vanaf de projectmap; op de Pi dus ~/BRMS/data/brms.db.
database = "data/brms.db"

[web]
# Webinterface (ARCHITECTURE.md §5.6): http://brms:8080 via Tailscale of aan boord.
# 0.0.0.0 = luisteren op alle netwerkinterfaces van de Pi.
host = "0.0.0.0"
port = 8080

# Eén blok per sensor. Alleen sensoren die hier staan worden verwerkt (ARCHITECTURE.md §5.4.2).
#   id          vaste ID; bij BLE-sensoren het MAC-adres (AA:BB:CC:DD:EE:FF), bij een
#               Shelly een vrij gekozen naam (bijv. shelly-bilge)
#   type        bthome (Xiaomi Monitor 3 met pvvx-firmware, BTHome v2)
#               ruuvi  (RuuviTag en RuuviTag Pro, dataformaat 5)
#               victron-bmv        (accumonitor: BMV-700 met dongle, SmartShunt)
#               victron-mppt       (zonnelader: BlueSolar met dongle, SmartSolar)
#               victron-multiplus  (MultiPlus met VE.Bus Smart dongle: walstroom)
#               shelly-uni         (Shelly Plus Uni via wifi: bilge; zie onderaan)
#   sleutel     alleen bij Victron: de versleutelingssleutel van het apparaat (32 tekens).
#               In VictronConnect: apparaat openen -> tandwiel -> Productinfo ->
#               "Instant readout via Bluetooth" aanzetten -> "Versleutelingsgegevens tonen".
#               Daar staat ook het MAC-adres (voor 'id').
#   naam        naam/locatie voor weergave; hernoemen laat de historie intact
#   grootheden  optioneel: alleen deze grootheden meenemen; zonder lijst gaat alles mee.
#               Welke namen een type levert:  brms grootheden bthome
#               (rssi = signaalsterkte; moet in de lijst staan als je die wilt houden)
#   correctie   optioneel, per doorlopende grootheid:
#                 een getal = offset             temperatuur = -0.3
#                 of factor en/of offset         vocht = { factor = 1.02, offset = -1.5 }
#               gecorrigeerd = gemeten × factor + offset

[[sensor]]
id = "A4:C1:38:00:00:01"
type = "bthome"
naam = "kajuit"
correctie = { temperatuur = 0.0, vocht = { factor = 1.0, offset = 0.0 } }

[[sensor]]
id = "A4:C1:38:00:00:02"
type = "bthome"
naam = "vooronder"
grootheden = ["temperatuur", "vocht", "batterijspanning", "rssi"]

[[sensor]]
id = "A4:C1:38:00:00:03"
type = "bthome"
naam = "motorruim"

# Victron-apparaten (ARCHITECTURE.md §5.2.2). Haal het # weg en vul MAC-adres en sleutel in.
# [[sensor]]
# id = "D3:00:00:00:00:01"
# type = "victron-bmv"
# naam = "accu"
# sleutel = "00000000000000000000000000000000"
#
# [[sensor]]
# id = "D3:00:00:00:00:02"
# type = "victron-mppt"
# naam = "zonnepaneel"
# sleutel = "00000000000000000000000000000000"
#
# [[sensor]]
# id = "D3:00:00:00:00:03"
# type = "victron-multiplus"
# naam = "multiplus"
# sleutel = "00000000000000000000000000000000"

# Shelly Plus Uni voor de bilge (ARCHITECTURE.md §5.2.4). Wordt via wifi gepolld door de
# Shelly-reader; de Shelly mag geen wachtwoord hebben. Haal het # weg en vul het adres in.
#   id         vrij gekozen vaste naam (letters, cijfers, - en _); staat in de database
#   adres      IP-adres of hostnaam van de Shelly; geef hem in de router een vast IP-adres
#   interval   seconden tussen twee polls (standaard 30; bilge 2: een pompbeurt kan kort zijn)
#   bron       welke component van de Shelly welke grootheid levert:
#                "input:0" / "input:1"   digitale ingang (contact): gesloten = 1
#                "voltmeter:100"         spanningsmeting; eerst in de Shelly toevoegen als
#                                        randapparaat (Add-on -> Voltmeter). Het nummer
#                                        staat in de Shelly, meestal 100.
#   drempel    spanning in volt vanaf waar een voltmeter-bron 1 geeft (pomp krijgt spanning)
#   omgekeerd  optioneel: grootheden waarvan 0 en 1 verwisseld worden, bijv. ["bilge"] voor
#              een vlotter waarvan het contact opengaat als het water stijgt
#   Levert: bilge, bilgepomp (elk alleen met een 'bron') en rssi (signaalsterkte van de wifi).
# [[sensor]]
# id = "shelly-bilge"
# type = "shelly-uni"
# naam = "bilge"
# adres = "192.168.1.50"
# interval = 2
# bron = { bilge = "input:0", bilgepomp = "voltmeter:100" }
# drempel = 6.0

# =============================================================================
# Camera's (ARCHITECTURE.md §5.7)
# =============================================================================
# Eén blok per camera. De camera-reader haalt elke 'foto_interval' een foto op van het
# snapshot-adres en zet die in de opnamemap. Haal het # weg en vul je eigen gegevens in.
#   id             vaste naam (letters, cijfers, '-' en '_'); wordt de mapnaam van de foto's
#   naam           naam voor weergave (mag weg: dan geldt het id)
#   gebruiker,     het account op de camera. Maak op de camera bij voorkeur een eigen
#   wachtwoord     gebruiker voor BRMS aan met alleen kijkrechten.
#   foto_url       het snapshot-adres van de camera (http:// of https://). Op de plaats van
#                  het account staan {gebruiker} en {wachtwoord}; BRMS vult die in. Zet het
#                  wachtwoord dus niet zelf in het adres.
#   video_url      het adres van de videostroom (rtsp://), voor video's (volgt later)
#   foto_interval  tijd tussen twee foto's; standaard "3m"
#
# Het voorbeeld is een Foscam HD-camera. Het snapshot-adres van een ander merk staat in de
# handleiding van de camera (zoek op "snapshot URL").
# [[camera]]
# id = "dek"
# naam = "Dek"
# gebruiker = "brms"
# wachtwoord = "..."
# foto_url = "http://192.168.1.20:88/cgi-bin/CGIProxy.fcgi?cmd=snapPicture2&usr={gebruiker}&pwd={wachtwoord}"
# video_url = "rtsp://{gebruiker}:{wachtwoord}@192.168.1.20:88/videoMain"
# foto_interval = "3m"
#
# Waar de opnames staan en hoe lang ze blijven. Zonder dit blok gelden deze waarden. Laat
# de map binnen data/ staan: alleen daar mogen de services schrijven.
# [opnames]
# map = "data/opnames"
# foto_bewaren = "14d"     # foto's ouder dan dit worden vanzelf verwijderd
# video_ruimte = 20        # GB; maximale ruimte voor video's (volgt later)

# =============================================================================
# Meldingen (ARCHITECTURE.md §5.5.4)
# =============================================================================
# Een melding gaat naar elk kanaal dat hier is ingesteld. Zonder kanaal worden alarmen wel
# vastgelegd, maar gaat er geen melding uit. Haal het # weg en vul je eigen gegevens in.
#
# Telegram: maak in de Telegram-app een bot aan via @BotFather (/newbot); je krijgt een
# token. Stuur de bot één bericht en open daarna
#   https://api.telegram.org/bot<token>/getUpdates
# in een browser: het getal bij "chat": {"id": ...} is het chat-ID.
# [melding.telegram]
# token = "123456789:AA..."
# chat = 123456789
#
# E-mail: een mailaccount met SMTP. Gebruik een app-wachtwoord, niet je gewone wachtwoord.
# Poort 587 (standaard) of 465. 'van' mag weg als de gebruikersnaam het mailadres is.
# [melding.email]
# server = "smtp.voorbeeld.nl"
# poort = 587
# gebruiker = "boot@voorbeeld.nl"
# wachtwoord = "app-wachtwoord"
# van = "boot@voorbeeld.nl"
# aan = ["ik@voorbeeld.nl"]

# =============================================================================
# Alarmregels (ARCHITECTURE.md §5.5.2, §5.5.3)
# =============================================================================
# Eén blok per regel. Alleen wat hier staat, wordt bewaakt.
#   id          vaste naam van de regel (letters, cijfers, - en _); staat in de database
#   naam        tekst in de melding (zonder: het id)
#   sensoren    voor welke sensoren de regel geldt (naam of id); elk apart beoordeeld
#   soort       "grens"   de waarde ligt boven of onder een grens
#               "aantal"  een aantal binnen een tijdvenster (bewegingen, pompbeurten)
#               "stil"    de sensor levert geen waarden meer
#   grootheid   welke grootheid (niet bij "stil")
#   boven / onder   bij "grens": de grens. Een toestand "= 1" is boven = 0.5, "= 0" is
#               onder = 0.5.
#   duur        zo lang moet de voorwaarde onafgebroken gelden (zonder: direct)
#   herstel     bij "grens": de herstelgrens; het verschil met de grens is de hysterese
#   herstelduur zo lang moet de herstelvoorwaarde gelden (zonder: direct)
#   aantal, venster   bij "aantal": zoveel of meer binnen dit tijdvenster
#   melding     "uit" (alleen vastleggen), "eenmalig" of "herhaald"
#   herhaling   bij "herhaald": de tussenpoos van de herinnering
#   herstelmelding   false = geen melding bij herstel
#   prioriteit  "urgent", "hoog" (met geluid in Telegram) of "normaal" (zonder geluid)
# Tijden: een getal met eenheid: "90s", "15m", "6u", "7d".

[[alarm]]
id = "vorst"
naam = "Vorst"
sensoren = ["kajuit", "vooronder", "motorruim"]
grootheid = "temperatuur"
soort = "grens"
onder = 2.0
duur = "15m"
herstel = 3.0
herhaling = "12u"
prioriteit = "hoog"

[[alarm]]
id = "vocht"
naam = "Vocht"
sensoren = ["kajuit", "motorruim"]
grootheid = "vocht"
soort = "grens"
boven = 80.0
duur = "6u"
herstel = 75.0
herhaling = "24u"

[[alarm]]
id = "sensor-stil"
naam = "Sensor stil"
sensoren = ["kajuit", "vooronder", "motorruim"]
soort = "stil"
duur = "30m"
herhaling = "24u"

[[alarm]]
id = "sensorbatterij"
naam = "Sensorbatterij laag"
sensoren = ["kajuit", "vooronder", "motorruim"]
grootheid = "batterijspanning"
soort = "grens"
onder = 2.5
duur = "1u"
herstel = 2.6
herhaling = "7d"

