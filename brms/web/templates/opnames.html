<!doctype html>
<html lang="nl">
<!--
  Opnamepagina van BRMS (ARCHITECTURE.md §5.6 punt 2, §5.7): de foto's en video's van de
  camera's bekijken en verwijderen.

  De pagina toont de opnames van één dag (de nieuwste bovenaan) als lijst, met daarboven
  één grote weergave van de gekozen opname. Er zijn bewust geen miniaturen: een dag heeft
  honderden intervalfoto's van elk enkele honderden kB, en over de mobiele verbinding van
  de boot is dat te veel. Een foto wordt pas opgehaald als hij gekozen wordt.

  Verwijderen gaat niet rechtstreeks: de pagina vraagt het aan de webservice, die een
  opdracht op de MQTT-bus zet; de opslag-service verwijdert bestand en databaserij (§3.1:
  één schrijver). Daarom wordt de lijst kort na een opdracht opnieuw opgehaald.

  "Foto nu" en "Video nu" geven de camera-reader een opdracht (poll-nu, §5.7 punt 12).

  Dagoverzicht (tweede weergave): de opnames van de dag worden van oud naar nieuw
  afgespeeld als een versnelde film. Een intervalfoto staat 0,5 s in beeld, een foto bij
  een gebeurtenis (alarm, op verzoek) 5 s, en een video wordt helemaal afgespeeld (met
  "verder" over te slaan). Dat gebeurt in de browser: de Pi maakt er geen videobestand van.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRMS – opnames</title>
<style>
  /* Dezelfde kleuren als de grafiekenpagina. */
  :root { --pagina: #f9f9f7; --vlak: #fcfcfb; --tekst: #0b0b0b; --zacht: #52514e;
          --raster: #e1e0d9; --rand: #c3c2b7; --fout: #b3261e; --keuze: #e3edf9; --link: #1f5fae; }
  @media (prefers-color-scheme: dark) {
    :root { --pagina: #0d0d0d; --vlak: #1a1a19; --tekst: #f0efec; --zacht: #c3c2b7;
            --raster: #2c2c2a; --rand: #383835; --fout: #f2867f; --keuze: #1d2c40; --link: #7fb0ee; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--pagina); color: var(--tekst);
         font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
  h1 small { font-weight: normal; color: var(--zacht); font-size: 13px; }
  a { color: var(--link); }
  select, button, input { font: inherit; color: var(--tekst); background: var(--pagina);
                          border: 1px solid var(--rand); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.gevaar { border-color: var(--fout); color: var(--fout); }
  label { color: var(--zacht); font-size: 13px; }
  .rij { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .rij .ruimte { flex: 1 1 auto; }
  .blok { background: var(--vlak); border: 1px solid var(--rand); border-radius: 8px;
          padding: 10px 12px; margin-bottom: 14px; }
  #status { margin: 0 2px 10px; min-height: 1.4em; color: var(--zacht); }
  #status.fout { color: var(--fout); }
  #totalen { color: var(--zacht); font-size: 13px; margin: 0 2px 10px; }
  /* De weergave: de opname past altijd in de breedte en blijft binnen het venster. */
  /* Het vak heeft een vaste vorm (16:9, de vorm van het camerabeeld) en de foto of video
     vult dat vak. Zonder vaste vorm verspringt de pagina bij elke wissel tussen foto en
     video: een video heeft nog geen afmetingen zolang hij niet geladen is. */
  #beeld { display: flex; justify-content: center; align-items: center; width: 100%;
           aspect-ratio: 16 / 9; max-height: 70vh;
           background: #000; border-radius: 6px; overflow: hidden; }
  #beeld img, #beeld video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #beeld .leeg { color: #bbb; padding: 40px 12px; text-align: center; }
  #bij { margin: 8px 0 0; }
  #bij .tijd { font-weight: 600; margin-right: 8px; }
  #bij .rest { color: var(--zacht); }
  /* Het dagoverzicht: de tijdbalk van de dag (00:00 links, 24:00 rechts). */
  #balk { position: relative; height: 26px; background: var(--raster); border-radius: 4px;
          cursor: pointer; overflow: hidden; }
  #balk .bereik { position: absolute; top: 0; bottom: 0; background: var(--rand); }
  #balk .merk { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px;
                background: var(--fout); }
  #balk .merk.video { background: var(--link); }
  #balk .wijzer { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px;
                  background: var(--tekst); }
  #uren { display: flex; justify-content: space-between; color: var(--zacht); font-size: 12px;
          margin: 2px 0 8px; }
  #uitleg-dag { color: var(--zacht); font-size: 13px; }
  #uitleg-dag i { display: inline-block; width: 3px; height: 11px; vertical-align: middle;
                  margin: 0 5px 0 12px; background: var(--fout); }
  #uitleg-dag i.video { background: var(--link); }
  #teller { color: var(--zacht); font-variant-numeric: tabular-nums; }
  /* De lijst. */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; font-size: 13px; color: var(--zacht);
       border-bottom: 1px solid var(--rand); padding: 4px 8px; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--raster); }
  td.getal, th.getal { text-align: right; font-variant-numeric: tabular-nums; }
  td.vink, th.vink { width: 30px; padding-right: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--raster); }
  tbody tr.gekozen { background: var(--keuze); }
  .lijst { max-height: 60vh; overflow: auto; }
  /* Met één camera is de kolom 'Camera' overbodig; dat scheelt ruimte op een telefoon. */
  body.een-camera .cam { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>BRMS <small>opnames · versie {{ versie }}</small></h1>
    <a href="/">Grafieken</a>
  </header>

  <div class="rij">
    <button id="vorige" title="Een dag eerder">◀</button>
    <input type="date" id="dag" title="De dag waarvan de opnames getoond worden">
    <button id="volgende" title="Een dag later">▶</button>
    <button id="vandaag">vandaag</button>
    <label>Camera <select id="camera"></select></label>
    <label>Weergave <select id="weergave" title="Lijst: opnames kiezen en verwijderen. Dagoverzicht: de dag afspelen als versnelde film.">
      <option value="lijst">lijst</option>
      <option value="dag">dagoverzicht</option>
    </select></label>
    <label class="alleen-lijst">Soort <select id="type">
      <option value="">foto's en video's</option>
      <option value="foto">alleen foto's</option>
      <option value="video">alleen video's</option>
    </select></label>
    <label class="alleen-lijst" title="Uit: alleen wat op verzoek of bij een alarm is gemaakt">
      <input type="checkbox" id="interval" checked> intervalfoto's</label>
    <span class="ruimte"></span>
    <button id="foto-nu" title="Laat de camera nu een foto maken">Foto nu</button>
    <button id="video-nu" title="Laat de camera nu een video opnemen">Video nu</button>
  </div>
  <p id="status"></p>

  <!-- De gekozen opname, groot. -->
  <section class="blok">
    <div id="beeld"><div class="leeg">Kies een opname uit de lijst.</div></div>
    <div class="rij" id="bij" hidden>
      <span><span class="tijd"></span><span class="rest"></span></span>
      <span class="ruimte"></span>
      <button id="ouder" class="alleen-lijst" title="De opname ervoor (pijl links)">◀ ouder</button>
      <button id="nieuwer" class="alleen-lijst" title="De opname erna (pijl rechts)">nieuwer ▶</button>
    </div>
    <!-- De bediening van het dagoverzicht. -->
    <div id="speler" class="alleen-dag" hidden>
      <div id="balk" title="Klik om naar dat tijdstip te springen"></div>
      <div id="uren"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
      <div class="rij">
        <button id="speel" title="Afspelen of pauzeren (spatiebalk)">▶ Afspelen</button>
        <button id="vorig-beeld" title="Eén opname terug (pijl links)">◀</button>
        <button id="volgend-beeld" title="Eén opname verder (pijl rechts)">▶</button>
        <button id="verder" title="Deze video overslaan" hidden>verder ▶▶</button>
        <span id="teller"></span>
        <span class="ruimte"></span>
        <span id="uitleg-dag"><i></i>foto bij een gebeurtenis<i class="video"></i>video</span>
      </div>
    </div>
  </section>

  <!-- De opnames van de gekozen dag. -->
  <section class="blok alleen-lijst">
    <div class="rij">
      <button id="alles">Alles selecteren</button>
      <button id="geen">Niets selecteren</button>
      <span class="ruimte"></span>
      <!-- Verwijderen in twee stappen, zodat één misklik niets weggooit. -->
      <button id="verwijder" class="gevaar" disabled>Verwijder selectie</button>
      <span id="zeker" hidden>
        <span id="vraag"></span>
        <button id="ja" class="gevaar">Ja, verwijder</button>
        <button id="nee">Annuleer</button>
      </span>
    </div>
    <div class="lijst">
      <table>
        <thead><tr><th class="vink"></th><th>Tijd</th><th>Soort</th><th class="cam">Camera</th>
          <th>Aanleiding</th><th class="getal">Grootte</th></tr></thead>
        <tbody id="rijen"></tbody>
      </table>
    </div>
  </section>
  <p id="totalen"></p>
</main>

<script>
// Door de webservice ingevuld: de camera's uit de configuratie en de grenzen voor opnames.
const CAMERAS = {{ cameras | tojson }};
const VIDEO_RUIMTE = {{ video_ruimte | tojson }};     // GB
const FOTO_BEWAREN = {{ foto_bewaren | tojson }};     // seconden

const el = id => document.getElementById(id);
let opnames = [];        // de opnames van de gekozen dag, de nieuwste eerst
let gekozen = null;      // sleutel van de opname in de weergave
let aanvraag = 0;        // volgnummer van de laatste aanvraag van de lijst
const geselecteerd = new Set();   // sleutels van de aangevinkte opnames

// Een opname is uniek door camera en tijdstip (de primaire sleutel van de tabel).
const sleutel = o => o.camera_id + "|" + o.ts;

// --- tekst -----------------------------------------------------------------------------
const twee = n => String(n).padStart(2, "0");
const tijd = ts => { const d = new Date(ts * 1000);
  return twee(d.getHours()) + ":" + twee(d.getMinutes()) + ":" + twee(d.getSeconds()); };
const datum = d => d.getFullYear() + "-" + twee(d.getMonth() + 1) + "-" + twee(d.getDate());
const grootte = b => b >= 1e9 ? (b / 1e9).toFixed(1).replace(".", ",") + " GB"
                   : b >= 1e6 ? (b / 1e6).toFixed(1).replace(".", ",") + " MB"
                   : Math.round(b / 1e3) + " kB";
const cameraNaam = id => (CAMERAS.find(c => c.id === id) || {naam: id}).naam;
// "alarm:vorst" -> "alarm vorst"; de andere aanleidingen staan er zoals ze zijn.
const aanleiding = a => a.startsWith("alarm:") ? "alarm " + a.slice(6) : a;
const soort = o => o.type === "video" ? "video " + o.duur + " s" : "foto";

function meld(tekst, fout) {
  el("status").textContent = tekst || "";
  el("status").classList.toggle("fout", !!fout);
}

// --- ophalen ---------------------------------------------------------------------------
// De gekozen dag loopt van middernacht tot middernacht in de tijd van de browser.
function laad() { return weergave === "dag" ? laadFilm() : laadLijst(); }

async function laadLijst() {
  const begin = new Date(el("dag").value + "T00:00:00");
  if (isNaN(begin)) return;
  const eind = new Date(begin); eind.setDate(eind.getDate() + 1);
  const vraag = new URLSearchParams({van: Math.floor(begin / 1000), tot: Math.floor(eind / 1000)});
  if (el("camera").value) vraag.set("camera", el("camera").value);
  if (el("type").value) vraag.set("type", el("type").value);
  if (!el("interval").checked) vraag.set("interval", "0");
  // Snel achter elkaar een andere dag of keuze: de antwoorden kunnen in een andere volgorde
  // terugkomen. Alleen het antwoord op de laatste aanvraag telt.
  const mijn = ++aanvraag;
  try {
    const a = await fetch("/api/opnames?" + vraag);
    if (!a.ok) throw new Error("fout " + a.status);
    const d = await a.json();
    if (mijn !== aanvraag) return;
    opnames = d.opnames;
    toonTotalen(d.totalen);
    // Wat niet meer bestaat, kan niet geselecteerd of gekozen blijven.
    const er = new Set(opnames.map(sleutel));
    for (const s of [...geselecteerd]) if (!er.has(s)) geselecteerd.delete(s);
    if (gekozen !== null && !er.has(gekozen)) gekozen = null;
    toonLijst();
    if (gekozen === null) toon(opnames.length ? opnames[0] : null);
    if (d.vol) meld("Alleen de nieuwste " + opnames.length + " opnames van deze dag staan in de lijst. "
                    + "Zet de intervalfoto's uit of kies een soort om de rest te zien.");
  } catch (e) {
    if (mijn === aanvraag) meld("De opnames konden niet worden opgehaald (" + e.message + ").", true);
  }
}

function toonTotalen(t) {
  const dagen = Math.round(FOTO_BEWAREN / 86400);
  el("totalen").textContent =
    "Foto's: " + t.foto[0] + " (" + grootte(t.foto[1] || 0) + "), worden " + dagen + " dagen bewaard"
    + " · Video's: " + t.video[0] + " (" + grootte(t.video[1] || 0) + " van " + VIDEO_RUIMTE
    + " GB); is die ruimte vol, dan verdwijnen de oudste.";
}

// --- de lijst --------------------------------------------------------------------------
function toonLijst() {
  const tbody = el("rijen");
  tbody.replaceChildren();
  if (!opnames.length) {
    const tr = tbody.insertRow(), td = tr.insertCell();
    td.colSpan = 6; td.textContent = "Geen opnames op deze dag (met deze keuze).";
    td.style.color = "var(--zacht)";
  }
  for (const o of opnames) {
    const tr = tbody.insertRow();
    tr.dataset.sleutel = sleutel(o);
    tr.classList.toggle("gekozen", sleutel(o) === gekozen);
    const vink = document.createElement("input");
    vink.type = "checkbox"; vink.checked = geselecteerd.has(sleutel(o));
    vink.title = "Selecteren om te verwijderen";
    // Het vinkje selecteert alleen; een klik elders op de rij toont de opname.
    vink.addEventListener("click", e => e.stopPropagation());
    vink.addEventListener("change", () => {
      vink.checked ? geselecteerd.add(sleutel(o)) : geselecteerd.delete(sleutel(o));
      toonKnoppen();
    });
    const c0 = tr.insertCell(); c0.className = "vink"; c0.append(vink);
    tr.insertCell().textContent = tijd(o.ts);
    tr.insertCell().textContent = soort(o);
    const c3 = tr.insertCell(); c3.className = "cam"; c3.textContent = cameraNaam(o.camera_id);
    tr.insertCell().textContent = aanleiding(o.aanleiding);
    const c5 = tr.insertCell(); c5.className = "getal"; c5.textContent = grootte(o.bytes);
    tr.addEventListener("click", () => toon(o));
  }
  toonKnoppen();
}

function toonKnoppen() {
  const n = geselecteerd.size;
  el("verwijder").disabled = n === 0;
  el("verwijder").textContent = n ? "Verwijder selectie (" + n + ")" : "Verwijder selectie";
  el("verwijder").hidden = false;
  el("zeker").hidden = true;
}

// --- de weergave -----------------------------------------------------------------------
function toon(o) {
  gekozen = o ? sleutel(o) : null;
  for (const tr of el("rijen").rows) tr.classList.toggle("gekozen", tr.dataset.sleutel === gekozen);
  const beeld = el("beeld");
  if (!o) {
    beeld.innerHTML = '<div class="leeg">Kies een opname uit de lijst.</div>';
    el("bij").hidden = true;
    return;
  }
  // Het pad bestaat alleen uit letters, cijfers, '-', '_', '/' en '.' (door de opslag
  // gecontroleerd); het kan zo in het adres.
  const adres = "/opname/" + o.bestand;
  let inhoud;
  if (o.type === "video") {
    inhoud = document.createElement("video");
    inhoud.controls = true;
    inhoud.preload = "metadata";      // nog niet de hele video ophalen
  } else {
    inhoud = document.createElement("img");
    inhoud.alt = "Foto van " + cameraNaam(o.camera_id) + " om " + tijd(o.ts);
  }
  if (o.type === "foto") inhoud.addEventListener("load", () => zetVorm(inhoud));
  inhoud.src = adres;
  beeld.replaceChildren(inhoud);
  el("bij").hidden = false;
  el("bij").querySelector(".tijd").textContent = el("dag").value + " " + tijd(o.ts);
  el("bij").querySelector(".rest").textContent =
    cameraNaam(o.camera_id) + " · " + soort(o) + " · " + aanleiding(o.aanleiding) + " · " + grootte(o.bytes);
  const i = opnames.findIndex(x => sleutel(x) === gekozen);
  // De lijst loopt van nieuw naar oud: "ouder" is verder naar beneden.
  el("ouder").disabled = i < 0 || i >= opnames.length - 1;
  el("nieuwer").disabled = i <= 0;
}

// Geeft het vak de vorm van het echte camerabeeld (standaard 16:9; een andere camera kan
// 4:3 leveren). Alleen bij een foto: die van dezelfde camera hebben steeds dezelfde vorm,
// dus het vak verspringt daarna niet meer.
function zetVorm(foto) {
  if (foto.naturalWidth && foto.naturalHeight)
    el("beeld").style.aspectRatio = foto.naturalWidth + " / " + foto.naturalHeight;
}

function stap(richting) {
  const i = opnames.findIndex(x => sleutel(x) === gekozen);
  const doel = opnames[i + richting];
  if (i < 0 || !doel) return;
  toon(doel);
  const tr = [...el("rijen").rows].find(r => r.dataset.sleutel === gekozen);
  if (tr) tr.scrollIntoView({block: "nearest"});
}

// --- dagoverzicht ----------------------------------------------------------------------
// De opnames van de dag als versnelde film (§5.6 punt 2), van oud naar nieuw.
const DUUR_INTERVAL = 500;       // ms dat een intervalfoto in beeld staat
const DUUR_GEBEURTENIS = 5000;   // ms voor een foto bij een gebeurtenis (alarm, op verzoek)
const VOORUIT = 4;               // zoveel volgende foto's alvast ophalen
let weergave = "lijst";          // "lijst" of "dag"
let film = [];                   // de opnames van de dag, de oudste eerst
let plek = 0;                    // welke opname van de film in beeld is
let speelt = false;
let wekker = null;               // de timer naar de volgende opname
let beurt = 0;                   // volgnummer: een foto die te laat binnenkomt telt niet meer
let dagBegin = 0;                // middernacht van de gekozen dag (Unix-seconden)
let voorraad = [];               // de alvast opgehaalde foto's (vasthouden, anders stopt het ophalen)

const gebeurtenis = o => o.aanleiding !== "interval";
// De plaats van een tijdstip op de tijdbalk, in procenten van de dag.
const opBalk = ts => Math.min(100, Math.max(0, (ts - dagBegin) / 864)) + "%";

async function laadFilm() {
  const begin = new Date(el("dag").value + "T00:00:00");
  if (isNaN(begin)) return;
  const eind = new Date(begin); eind.setDate(eind.getDate() + 1);
  dagBegin = Math.floor(begin / 1000);
  // Alle opnames van de dag: de soort en de intervalfoto's zijn hier geen keuze.
  const vraag = new URLSearchParams({van: dagBegin, tot: Math.floor(eind / 1000), alles: "1"});
  if (el("camera").value) vraag.set("camera", el("camera").value);
  const mijn = ++aanvraag;
  pauze();
  try {
    const a = await fetch("/api/opnames?" + vraag);
    if (!a.ok) throw new Error("fout " + a.status);
    const d = await a.json();
    if (mijn !== aanvraag) return;
    film = d.opnames.reverse();          // het antwoord is van nieuw naar oud
    toonTotalen(d.totalen);
    plek = 0;
    tekenBalk();
    toonPlek();
    // Vooraf zeggen wat afspelen kost: over de mobiele verbinding van de boot telt dat.
    const bytes = film.reduce((som, o) => som + o.bytes, 0);
    meld(film.length ? "Dagoverzicht: " + film.length + " opnames, samen " + grootte(bytes) + "."
                     : "");
    if (d.vol) meld("Deze dag heeft meer opnames dan het dagoverzicht aankan; alleen de laatste "
                    + film.length + " worden afgespeeld.");
  } catch (e) {
    if (mijn === aanvraag) meld("De opnames konden niet worden opgehaald (" + e.message + ").", true);
  }
}

// De tijdbalk: het stuk van de dag waarin opnames zijn, en een streep per gebeurtenis.
function tekenBalk() {
  const balk = el("balk");
  balk.replaceChildren();
  if (!film.length) return;
  const stuk = (klasse, ts) => { const d = document.createElement("div");
    d.className = klasse; d.style.left = opBalk(ts); balk.append(d); return d; };
  const bereik = stuk("bereik", film[0].ts);
  bereik.style.right = "calc(100% - " + opBalk(film[film.length - 1].ts) + ")";
  for (const o of film)
    if (gebeurtenis(o)) {
      const merk = stuk(o.type === "video" ? "merk video" : "merk", o.ts);
      merk.title = tijd(o.ts) + " " + soort(o) + " (" + aanleiding(o.aanleiding) + ")";
    }
  stuk("wijzer", film[0].ts).id = "wijzer";
}

// Zet de opname op `plek` in beeld. Loopt het overzicht, dan gaat het vanzelf verder: bij
// een foto na de vaste tijd, bij een video als die afgelopen is.
function toonPlek() {
  const mijn = ++beurt;
  clearTimeout(wekker);
  const o = film[plek];
  el("verder").hidden = !o || o.type !== "video";
  el("vorig-beeld").disabled = plek <= 0;
  el("volgend-beeld").disabled = plek >= film.length - 1;
  el("speel").disabled = !film.length;
  el("teller").textContent = film.length ? (plek + 1) + " / " + film.length : "";
  if (!o) {
    el("beeld").innerHTML = '<div class="leeg">Geen opnames op deze dag.</div>';
    el("bij").hidden = true;
    return;
  }
  el("bij").hidden = false;
  el("bij").querySelector(".tijd").textContent = el("dag").value + " " + tijd(o.ts);
  el("bij").querySelector(".rest").textContent =
    cameraNaam(o.camera_id) + " · " + soort(o) + " · " + aanleiding(o.aanleiding);
  if (el("wijzer")) el("wijzer").style.left = opBalk(o.ts);
  const adres = "/opname/" + o.bestand;

  if (o.type === "video") {
    const video = document.createElement("video");
    video.controls = true;
    video.muted = true;           // er is geen geluid; zo mag de browser vanzelf afspelen
    video.playsInline = true;
    video.src = adres;
    // Na de video verder met de volgende opname. Dat mag maar één keer gebeuren, en alleen
    // als deze video nog in beeld is (mijn === beurt).
    let klaar = false;
    const door = () => {
      if (klaar || mijn !== beurt) return;
      klaar = true;
      clearInterval(wacht);
      if (speelt) volgende();
    };
    // Afgelopen, of niet af te spelen (bestand weg).
    video.addEventListener("ended", door);
    video.addEventListener("error", door);
    // Vangnet: niet elke browser meldt het einde van elke video. Staat de video op zijn
    // einde stil, dan geldt hij ook als afgelopen.
    let laatst = -1;
    const wacht = setInterval(() => {
      if (mijn !== beurt) { clearInterval(wacht); return; }
      const bijnaUit = isFinite(video.duration) && video.duration - video.currentTime < 0.5;
      if (video.ended || (speelt && bijnaUit && video.currentTime === laatst)) door();
      laatst = video.currentTime;
    }, 1000);
    // De knoppen van de video zelf horen bij het overzicht: start de gebruiker de video
    // daar, dan loopt het overzicht (en gaat het na de video verder); zet hij hem daar op
    // pauze, dan staat het overzicht stil.
    video.addEventListener("play", () => {
      if (mijn !== beurt || speelt) return;
      speelt = true;
      el("speel").textContent = "⏸ Pauze";
    });
    video.addEventListener("pause", () => {
      // Aan het einde van een video meldt de browser ook een pauze; die telt niet.
      const uit = video.ended || (isFinite(video.duration) && video.duration - video.currentTime < 0.5);
      if (mijn !== beurt || !speelt || uit) return;
      speelt = false;
      el("speel").textContent = "▶ Afspelen";
    });
    el("beeld").replaceChildren(video);
    if (speelt) video.play().catch(() => {});
    return;
  }

  // Een foto: eerst ophalen, dan pas in beeld zetten. Zo blijft de vorige foto staan tot
  // de nieuwe er is (geen zwart beeld ertussen) en begint de tijd pas te lopen als de
  // foto er staat. Het overzicht wacht dus op een trage verbinding en slaat niets over.
  // Staat er nog een video in beeld (overgeslagen met "verder"), dan stopt die meteen; hij
  // blijft als stilstaand beeld staan tot de foto er is.
  const oud = el("beeld").querySelector("video");
  if (oud) oud.pause();
  const foto = new Image();
  foto.onload = () => {
    if (mijn !== beurt) return;
    let img = el("beeld").querySelector("img");
    if (!img) { img = document.createElement("img"); el("beeld").replaceChildren(img); }
    img.src = adres;
    img.alt = "Foto van " + cameraNaam(o.camera_id) + " om " + tijd(o.ts);
    zetVorm(foto);
    if (speelt) wekker = setTimeout(volgende, gebeurtenis(o) ? DUUR_GEBEURTENIS : DUUR_INTERVAL);
  };
  // Het bestand is er niet meer (bijvoorbeeld net opgeruimd): overslaan.
  foto.onerror = () => { if (mijn === beurt && speelt) volgende(); };
  foto.src = adres;
  // De volgende foto's alvast ophalen terwijl deze in beeld is.
  voorraad = [foto];
  for (const volgend of film.slice(plek + 1, plek + 1 + VOORUIT))
    if (volgend.type === "foto") {
      const alvast = new Image();
      alvast.src = "/opname/" + volgend.bestand;
      voorraad.push(alvast);
    }
}

function volgende() {
  if (plek >= film.length - 1) { pauze(); return; }   // einde van de dag
  plek++;
  toonPlek();
}

function speel() {
  if (!film.length) return;
  if (plek >= film.length - 1) plek = 0;              // aan het einde: opnieuw van voren
  speelt = true;
  el("speel").textContent = "⏸ Pauze";
  // Een video die op pauze stond gaat verder waar hij was; al het andere begint opnieuw.
  const video = el("beeld").querySelector("video");
  if (video && film[plek].type === "video" && !video.ended) video.play().catch(() => {});
  else toonPlek();
}

function pauze() {
  speelt = false;
  clearTimeout(wekker);
  el("speel").textContent = "▶ Afspelen";
  const video = el("beeld").querySelector("video");
  if (video) video.pause();
}

// Eén opname terug of verder; het afspelen stopt dan.
function verspring(naar) {
  if (naar < 0 || naar >= film.length) return;
  pauze();
  plek = naar;
  toonPlek();
}

function zetWeergave(nieuw) {
  weergave = nieuw === "dag" ? "dag" : "lijst";
  el("weergave").value = weergave;
  pauze();
  for (const e of document.querySelectorAll(".alleen-lijst")) e.hidden = weergave !== "lijst";
  for (const e of document.querySelectorAll(".alleen-dag")) e.hidden = weergave !== "dag";
  try { localStorage.setItem("brms-opnames-weergave", weergave); } catch (e) { /* mag mislukken */ }
  gekozen = null;
  meld("");
  laad();
}

// --- opdrachten ------------------------------------------------------------------------
async function opdracht(adres, inhoud) {
  const a = await fetch(adres, {method: "POST", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify(inhoud)});
  const d = await a.json().catch(() => ({}));
  if (!a.ok) throw new Error(d.fout || "fout " + a.status);
  return d;
}

async function verwijder() {
  const lijst = opnames.filter(o => geselecteerd.has(sleutel(o))).map(o => [o.camera_id, o.ts]);
  try {
    await opdracht("/api/opnames/verwijder", {opnames: lijst});
    meld(lijst.length + " opnames worden verwijderd …");
    geselecteerd.clear();
    // De opslag-service verwijdert; kort daarna staat het in de database.
    setTimeout(laad, 1000);
    setTimeout(() => { laad(); meld(""); }, 4000);
  } catch (e) { meld("Verwijderen is niet gelukt: " + e.message, true); }
  toonKnoppen();
}

// De opnames van het laatste uur die op verzoek of bij een alarm zijn gemaakt, voor één
// camera en één soort. Hiermee herkent de pagina de opname die zij zelf net gevraagd heeft.
async function recent(camera, type) {
  const nu = Math.floor(Date.now() / 1000);
  const vraag = new URLSearchParams({van: nu - 3600, tot: nu + 3600, camera: camera.id, type, interval: "0"});
  const a = await fetch("/api/opnames?" + vraag);
  if (!a.ok) throw new Error("fout " + a.status);
  return (await a.json()).opnames;
}

// Wacht tot er een opname op verzoek bij is gekomen die nog niet in `bekend` staat; kijkt
// elke seconde, hooguit `seconden` lang. Geeft de opname, of null als hij niet komt.
async function wachtOpNieuwe(camera, type, bekend, seconden) {
  for (let i = 0; i < seconden; i++) {
    await new Promise(r => setTimeout(r, 1000));
    const nieuw = (await recent(camera, type))
      .find(o => !bekend.has(sleutel(o)) && o.aanleiding === "handmatig");
    if (nieuw) return nieuw;
  }
  return null;
}

// Gaat naar de dag van een opname en zet die opname in beeld, in de lijst of in het
// dagoverzicht (dat blijft dan stilstaan op die opname).
async function toonOpname(o) {
  el("dag").value = datum(new Date(o.ts * 1000));
  // De keuze van de soort mag de opname niet verbergen.
  if (el("type").value && el("type").value !== o.type) el("type").value = "";
  gekozen = null;
  await laad();
  if (weergave === "dag") {
    const i = film.findIndex(x => sleutel(x) === sleutel(o));
    if (i >= 0) { plek = i; toonPlek(); }
  } else {
    const gevonden = opnames.find(x => sleutel(x) === sleutel(o));
    if (gevonden) toon(gevonden);
  }
}

async function opnameNu(type) {
  const camera = CAMERAS.find(c => c.id === el("camera").value) || CAMERAS[0];
  if (!camera) return;
  el("foto-nu").disabled = el("video-nu").disabled = true;
  try {
    // Wat er al is, vóór de opdracht: alles wat daarna bijkomt is de gevraagde opname.
    const bekend = new Set((await recent(camera, type)).map(sleutel));
    await opdracht("/api/opnames/nu", {camera_id: camera.id, type});
    let nieuw;
    if (type === "foto") {
      meld("Foto van " + camera.naam + " wordt gemaakt …");
      nieuw = await wachtOpNieuwe(camera, type, bekend, 15);
    } else {
      // De video staat er pas als de opname klaar is.
      const duur = Math.round(camera.video_duur);
      meld("Video van " + camera.naam + " wordt opgenomen (" + duur + " s) …");
      await new Promise(r => setTimeout(r, Math.max(0, duur - 2) * 1000));
      nieuw = await wachtOpNieuwe(camera, type, bekend, 45);
    }
    if (nieuw) { meld(""); await toonOpname(nieuw); }
    else meld("De " + type + " is niet binnengekomen. De reden staat in het log van de "
              + "camera-reader (journalctl -u brms-camera).", true);
  } catch (e) { meld("De opdracht is niet gelukt: " + e.message, true); }
  el("foto-nu").disabled = !CAMERAS.length;
  zetVideoKnop();
}

// --- dag kiezen ------------------------------------------------------------------------
function zetDag(d) { el("dag").value = datum(d); gekozen = null; geselecteerd.clear(); laad(); }
function schuif(dagen) {
  const d = new Date(el("dag").value + "T00:00:00");
  if (isNaN(d)) return;
  d.setDate(d.getDate() + dagen);
  zetDag(d);
}

// --- start -----------------------------------------------------------------------------
document.body.classList.toggle("een-camera", CAMERAS.length <= 1);
el("camera").parentElement.hidden = CAMERAS.length <= 1;
el("camera").add(new Option("alle camera's", ""));
for (const c of CAMERAS) el("camera").add(new Option(c.naam, c.id));
// Zonder camera in de configuratie valt er niets op te nemen.
el("foto-nu").disabled = !CAMERAS.length;
function zetVideoKnop() {
  const camera = CAMERAS.find(c => c.id === el("camera").value) || CAMERAS[0];
  el("video-nu").disabled = !camera || !camera.video;
}
zetVideoKnop();
if (!CAMERAS.length) meld("Er is geen camera ingesteld in brms.toml ([[camera]]).");

el("vorige").addEventListener("click", () => schuif(-1));
el("volgende").addEventListener("click", () => schuif(1));
el("vandaag").addEventListener("click", () => zetDag(new Date()));
el("dag").addEventListener("change", () => { gekozen = null; geselecteerd.clear(); laad(); });
for (const id of ["camera", "type", "interval"])
  el(id).addEventListener("change", () => { gekozen = null; zetVideoKnop(); laad(); });
el("ouder").addEventListener("click", () => stap(1));
el("nieuwer").addEventListener("click", () => stap(-1));
el("alles").addEventListener("click", () => { for (const o of opnames) geselecteerd.add(sleutel(o)); toonLijst(); });
el("geen").addEventListener("click", () => { geselecteerd.clear(); toonLijst(); });
el("verwijder").addEventListener("click", () => {
  el("vraag").textContent = geselecteerd.size + " opnames verwijderen? Dit kan niet ongedaan worden.";
  el("verwijder").hidden = true;
  el("zeker").hidden = false;
});
el("nee").addEventListener("click", toonKnoppen);
el("ja").addEventListener("click", verwijder);
el("foto-nu").addEventListener("click", () => opnameNu("foto"));
el("video-nu").addEventListener("click", () => opnameNu("video"));
// Pijltjes bladeren door de opnames, behalve als de datum of een keuzelijst de invoer heeft.
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "VIDEO"].includes(document.activeElement.tagName)) return;
  if (weergave === "dag") {
    // In het dagoverzicht: pijltjes één opname terug of verder, de spatiebalk speelt of
    // pauzeert.
    if (e.key === "ArrowLeft") verspring(plek - 1);
    if (e.key === "ArrowRight") verspring(plek + 1);
    if (e.key === " " && document.activeElement.tagName !== "BUTTON") {
      e.preventDefault();
      speelt ? pauze() : speel();
    }
    return;
  }
  if (e.key === "ArrowLeft") stap(1);
  if (e.key === "ArrowRight") stap(-1);
});

// Het dagoverzicht.
el("weergave").addEventListener("change", () => zetWeergave(el("weergave").value));
el("speel").addEventListener("click", () => speelt ? pauze() : speel());
el("vorig-beeld").addEventListener("click", () => verspring(plek - 1));
el("volgend-beeld").addEventListener("click", () => verspring(plek + 1));
// "verder": de video overslaan; het overzicht loopt door als het liep.
el("verder").addEventListener("click", () => {
  if (plek >= film.length - 1) { pauze(); return; }
  plek++;
  toonPlek();
});
// Een klik op de tijdbalk springt naar de eerste opname vanaf dat tijdstip.
el("balk").addEventListener("click", e => {
  if (!film.length) return;
  const vak = el("balk").getBoundingClientRect();
  const ts = dagBegin + (e.clientX - vak.left) / vak.width * 86400;
  const i = film.findIndex(o => o.ts >= ts);
  const doel = i < 0 ? film.length - 1 : i;
  // Liep het overzicht, dan loopt het vanaf daar door.
  plek = doel;
  toonPlek();
});

el("dag").value = datum(new Date());
// De laatst gekozen weergave onthouden (alleen in deze browser).
let bewaard = "lijst";
try { bewaard = localStorage.getItem("brms-opnames-weergave") || "lijst"; } catch (e) { /* geen opslag */ }
zetWeergave(bewaard);
</script>
</body>
</html>
